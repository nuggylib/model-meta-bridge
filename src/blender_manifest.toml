schema_version = "1.0.0"

id = "model_meta_bridge"
version = "0.5.0"
name = "Model Meta Bridge"
tagline = "Streams the open Blender file to the Model Meta spec checker"
maintainer = "Armando Vasquez <mando@mcnuggies.dev>"
type = "add-on"

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[permissions]
network = "Answers Model Meta scene queries on localhost"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "CLAUDE.md",
]
